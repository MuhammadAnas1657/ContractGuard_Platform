version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: contractguard-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hackathon_secret_password
      POSTGRES_DB: hackathon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathon"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contractguard-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:hackathon_secret_password@db:5432/hackathon
      NEBIUS_BASE_URL: https://api.tokenfactory.nebius.ai/v1
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEMOTRON_SYNTHESIS_MODEL: nvidia/llama-3.1-nemotron-70b-instruct
      NEMOTRON_VERIFIER_MODEL: nvidia/nemotron-mini-4b-instruct
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contractguard-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080
    ports:
      - "3001:3001"

volumes:
  postgres_data:
